name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Duskyport
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Get version
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Go binaries
        run: |
          mkdir -p bin/x86_64
          go build -v -ldflags="-s -w" -o bin/x86_64/duskyport-fetch ./cmd/duskyport-fetch
          go build -v -ldflags="-s -w" -o bin/x86_64/duskyport-mon ./cmd/duskyport-mon
          go build -v -ldflags="-s -w" -o bin/x86_64/duskyssh ./cmd/duskyssh
          go build -v -ldflags="-s -w" -o bin/x86_64/duskyport-gpuvm ./cmd/duskyport-gpuvm

      - name: Package Release Tarball
        run: |
          VER="${{ steps.vars.outputs.version }}"
          PKG_NAME="duskyport-${VER}-linux-x86_64"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          tar -czvf "${DIST_DIR}/${PKG_NAME}.tar.gz" \
            --exclude=".git" \
            --exclude="dist" \
            bin/ \
            cmd/ \
            client/ \
            runtime/ \
            matugen/ \
            packaging/ \
            scripts/ \
            install.sh \
            go.mod \
            README.md \
            LICENSE

          cd "$DIST_DIR"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          cp ../install.sh .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Duskyport ${{ steps.vars.outputs.tag }}
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
